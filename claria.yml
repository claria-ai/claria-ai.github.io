# Site parameters — the single source of truth for anything version-dependent.
# Edit this file, then run `python3 build.py` (or `uv run build.py`) to
# regenerate the HTML pages. Never edit the generated HTML directly.

site:
  github_url: https://github.com/claria-ai/claria
  copyright_year: 2026

release:
  version: 0.19.0
  # Artifact URLs are derived by build.py:
  #   {download_base}/v{version}/Claria_{version}_{suffix}
  download_base: https://github.com/claria-ai/claria/releases/download
  artifacts:
    - platform: macOS
      kind: Apple Silicon (.dmg)
      suffix: aarch64.dmg
      size: 12.8 MB
      icon: apple
      card_class: macos-card
      beta_hint: See beta instructions below
    - platform: Windows
      kind: Installer (.exe)
      suffix: x64-setup.exe
      size: 7.0 MB
      icon: windows
    - platform: Windows
      kind: MSI package (.msi)
      suffix: x64_en-US.msi
      size: 10.0 MB
      icon: windows
